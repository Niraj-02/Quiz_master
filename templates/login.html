<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #eeeeee; font-family: cursive;" >
            
            <h2 style="text-align: center;margin-top: 53px;" >Quiz Master</h2>            
            {% if error %}
                        <div class="alert alert-danger" role="alert" style="text-align: center;">
                            {{ error }}
                        </div>
            {% endif %}
            <div id = "login_form">
                
                <h4 style="display: inline;">Log in to you Quiz Master account</h4>
                <br>
                <br>
                <form action="/login" method="post">
                    

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input name = "username" type="text" class="form-control" id="username" placeholder="Shubham">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input name = "password" type="password" class="form-control" id="password" placeholder="****">
                    </div>

                    <button type="submit" class="btn btn-success">Login</button>
                </form>
            </div>
            
            <div style="text-align: center; font-size: 25px; margin-top: 9px;">
                Don't have an account? <a href="/register" style="margin-left: 6px;font-size: 20px; color: black;">Sign up</a>
                
            </div>
    
</body>
</html>
