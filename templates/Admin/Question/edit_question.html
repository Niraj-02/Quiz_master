{% extends "Admin/admin_layout.html" %}

{% block title %}
Add Question
{% endblock %}





{% block content %}
<div class="container-fluid" id="add_sub" style="height: auto;">
    <h3 style="color: brown; font-family: cursive;">Add Question</h3>
    <br>
    <form action="{{ url_for('edit_question', questionID=question.questionID) }}" method="post">
        <div class="mb-3">
            <label for="question" class="form-label">Enter your question</label>
            <textarea name="question"  type="text" class="form-control" id="question" required rows="2"> {{question.question}} </textarea>
        </div>

        <div class="mb-3">
            <label for="A" class="form-label">Option 1</label>
            <textarea name="A"  type="text" class="form-control" id="A" required rows="1"> {{question.A}} </textarea>            
        </div>

        <div class="mb-3">
            <label for="B" class="form-label">Option 2</label>
            <textarea name="B"  type="text" class="form-control" id="B" required rows="1"> {{question.B}} </textarea> 
        </div>

        <div class="mb-3">
            <label for="C" class="form-label">Option 3</label>
            <textarea name="C"  type="text" class="form-control" id="C" required rows="1"> {{question.C}} </textarea> 
        </div>

        <div class="mb-3">
            <label for="D" class="form-label">Option 4</label>
            <textarea name="D"  type="text" class="form-control" id="D" required rows="1"> {{question.D}} </textarea> 
        </div>
        
        <div class="mb-3">
            <label for="answer" class="form-label">Answer</label>
            <textarea name="answer"  type="text" class="form-control" id="answer" required rows="1"> {{question.answer}} </textarea> 
        </div>
        
        <button type="submit" class="btn btn-success">Save Changes</button>
    </form>


</div>
{% endblock %}
