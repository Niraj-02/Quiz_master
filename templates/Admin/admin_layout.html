<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>
        {% block title %}
        {% endblock %}
    </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- js for summary charts  -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="navbar">

        {% block navbar %}
        
        

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="/static/images/Qwiz_Logo.jpeg" alt="Logo" width="50" height="40" class="d-inline-block align-text-top">
                </a>

                
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{{ url_for('admin_dash')}}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('subjects')}}">Subjects</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('chapters')}}">Chapters</a>
                    </li>

                    <li class="nav-item">
                    <a class="nav-link active" href="{{ url_for('quiz')}}">Quiz</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('users')}}">Users</a>
                    </li>
                </ul>

                    
                <form method="POST" action ='/search' class="d-flex" style="margin-left: 300px;">
                    <select name="category" class="form-select">
                        <option value="" selected>Select Type</option>
                        <option value="subject">Search for subject</option>
                        <option value="username">Search for UserName</option>
                        <option value="quiz">Search for a Quiz</option>
                    </select>
                    <input type="text" name="search" class="form-control me-2" placeholder="Search" required>
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>
                    
                    
                <a class="nav-link active" href="{{ url_for('logout')}}" style="margin-left: 350px;"><strong>Logout</strong></a>
                    


                    
                
                </div>
            </div>
            </nav>


        {% endblock %}
    </div>

    <div id="content">
        {% block content %}
        {% endblock %}
    </div>

    
</body>
</html>
