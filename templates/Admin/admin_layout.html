<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>
        {% block title %}
        {% endblock %}
    </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="navbar">

        {% block navbar %}
        
        

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="/static/images/Qwiz_Logo.jpeg" alt="Logo" width="50" height="40" class="d-inline-block align-text-top">
                </a>

                
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{{ url_for('admin_dash')}}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('subjects')}}">Subjects</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('chapters')}}">Chapters</a>
                    </li>

                    <li class="nav-item">
                    <a class="nav-link active" href="#">Quiz</a>
                    </li>

                    
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Logout</a>
                    </li>
                    
                </ul>
                </div>
            </div>
            </nav>


        {% endblock %}
    </div>

    <div id="content">
        {% block content %}
        {% endblock %}
    </div>

    <div id="footer">
        {% block footer %}
        
        {% endblock %}
    </div>
</body>
</html>
