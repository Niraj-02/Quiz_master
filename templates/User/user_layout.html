<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>
        {% block title %}
        {% endblock %}
    </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- javascript for summary  -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>
<body>
    <div id="navbar">

        {% block navbar %}
         
        

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{ url_for('dashboard' , username=session['username'])}}">
                    <img src="/static/images/Qwiz_Logo.jpeg" alt="Logo" width="50" height="40" class="d-inline-block align-text-top">
                </a>

                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('dashboard' , username=session['username'])}}">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="{{ url_for('result' , username=session['username'])}}">Scores</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="{{ url_for('summary' , username=session['username'])}}">Summary</a>
                        </li>
                        

                        <li class="nav-item" style="margin-left: 1100px;">
                            <a class="nav-link active" href="{{ url_for('profile' , username=session['username'])}}"><strong>Profile</strong></a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="{{ url_for('logout')}}"><strong>Logout</strong></a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>


        {% endblock %}
    </div>

    <div id="content">
        {% block content %}
        {% endblock %}
    </div>

    
</body>
</html>
