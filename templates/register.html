<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #eeeeee; font-family: cursive;" >

            <h2 style="text-align: center;margin-top: 53px;" >Quiz Master</h2>            
            
            <div id = "reg_form">
                <!-- style="text-align: center;" -->
                <h3 style="display: inline;">Create a free account</h3>
                <br>
                <br>

                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="fullname" class="form-label">Full name</label>
                        <input name="fullname"  type="text" class="form-control" id="fullname" placeholder="your name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input name="email" type="text" class="form-control" id="email" placeholder="abc@xyz.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input name="username" type="text" class="form-control" id="username" placeholder="Shubham" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input name="password" type="password" class="form-control" id="password" placeholder="****" required>
                    </div>

                    <button type="submit" class="btn btn-success">Sign up</button>
                </form>
                
            </div>

            <div style="text-align: center; font-size: 25px; margin-top: 9px;">
                Already have an account? <a href="/login" style="margin-left: 6px;font-size: 20px; color: black;">Login</a>
                
            </div>

            
    
</body>
</html>
